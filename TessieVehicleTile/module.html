<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --accent: #2bb3c0;
            --bg: transparent;
            --box: rgba(127, 135, 145, .16);
            --text: #ffffff;
            --textmuted: #9fb0c0;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --scale: 1;
            --track: rgba(127, 135, 145, .25);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --box: rgba(20, 30, 45, .06);
                --text: #1b2430;
                --textmuted: #5c6b7a;
            }
        }

        html { height: 100%; background: var(--bg); overflow: hidden; }
        body { margin: 0; height: 100%; box-sizing: border-box; font-family: var(--font); color: var(--text); }
        .wrap { box-sizing: border-box; padding: 50px 18px 16px; }

        .tsl-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
        .tsl-name { font-size: calc(17px * var(--scale)); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tsl-pill { font-size: calc(12px * var(--scale)); font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--box); color: var(--textmuted); }
        .tsl-pill.ok { color: var(--accent); }

        .tsl-top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
        .tsl-ring { position: relative; width: calc(96px * var(--scale)); height: calc(96px * var(--scale)); flex: 0 0 auto; }
        .tsl-ring svg { width: 100%; height: 100%; display: block; }
        .tsl-ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(21px * var(--scale)); font-weight: 700; color: var(--text); }
        .tsl-stats { display: flex; flex-direction: column; gap: 3px; }
        .tsl-range { font-size: calc(19px * var(--scale)); font-weight: 700; color: var(--text); }
        .tsl-sub { font-size: calc(13px * var(--scale)); color: var(--textmuted); }

        .tsl-state { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .tsl-dot { width: calc(12px * var(--scale)); height: calc(12px * var(--scale)); border-radius: 50%; flex: 0 0 auto; color: var(--accent); background: var(--accent); box-shadow: 0 0 6px 1px currentColor; }
        .tsl-state-lbl { font-size: calc(15px * var(--scale)); font-weight: 700; color: var(--accent); }
        #card.live .tsl-dot { animation: tslpulse 1.4s ease-in-out infinite; }
        @keyframes tslpulse { 0%,100% { box-shadow: 0 0 4px 0 currentColor; transform: scale(1); } 50% { box-shadow: 0 0 13px 4px currentColor; transform: scale(1.18); } }

        .tsl-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .tsl-box { background: var(--box); border-radius: 11px; padding: 9px 11px; }
        .tsl-box .v { font-size: calc(15px * var(--scale)); font-weight: 700; color: var(--text); }
        .tsl-box .k { font-size: calc(10px * var(--scale)); color: var(--textmuted); margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }

        .tsl-loc { margin-bottom: 12px; }
        .tsl-loc a { color: var(--accent); text-decoration: none; font-size: calc(13px * var(--scale)); }

        .tsl-rules { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .tsl-rules .hdrow { display: flex; align-items: center; justify-content: space-between; }
        .tsl-rules .hd { font-size: calc(10px * var(--scale)); color: var(--textmuted); text-transform: uppercase; letter-spacing: .5px; }
        .tsl-rule { display: flex; align-items: center; gap: 8px; background: var(--box); border-radius: 11px; padding: 8px 11px; }
        .tsl-rule .t { flex: 1 1 auto; font-size: calc(12px * var(--scale)); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tsl-rule.off .t { color: var(--textmuted); }
        .tsl-ico { flex: 0 0 auto; border: none; background: none; color: var(--textmuted); cursor: pointer; font-size: calc(13px * var(--scale)); padding: 2px 4px; border-radius: 6px; }
        .tsl-ico:hover { color: var(--text); background: var(--track); }
        .tsl-ico.warn { color: #e05a4e; }
        .tsl-add { border: 1px dashed var(--textmuted); background: none; color: var(--textmuted); border-radius: 999px; font-size: calc(11px * var(--scale)); padding: 2px 10px; cursor: pointer; }
        .tsl-add:hover { color: var(--accent); border-color: var(--accent); }
        .tsl-sw { flex: 0 0 auto; width: calc(36px * var(--scale)); height: calc(20px * var(--scale)); border: none; border-radius: 999px; background: var(--track); cursor: pointer; position: relative; padding: 0; }
        .tsl-sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: calc(16px * var(--scale)); height: calc(16px * var(--scale)); border-radius: 50%; background: #fff; transition: transform .15s ease; }
        .tsl-sw.on { background: var(--accent); }
        .tsl-sw.on::after { transform: translateX(calc(16px * var(--scale))); }

        /* Regel-Editor (Overlay) */
        .tsl-ed { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow: auto; z-index: 10; }
        .tsl-ed.open { display: flex; }
        .tsl-ed-card { background: var(--bg); border: 1px solid var(--track); border-radius: 14px; padding: 16px; width: 100%; max-width: 520px; box-sizing: border-box; backdrop-filter: blur(6px); background-color: rgba(30,36,44,.97); }
        @media (prefers-color-scheme: light) { .tsl-ed-card { background-color: rgba(250,251,252,.98); } }
        .tsl-ed-card h3 { margin: 0 0 12px; font-size: calc(14px * var(--scale)); color: var(--text); }
        .tsl-ed-card label { display: block; font-size: calc(10px * var(--scale)); color: var(--textmuted); text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 4px; }
        .tsl-ed-card select, .tsl-ed-card input { width: 100%; box-sizing: border-box; background: var(--box); color: var(--text); border: 1px solid var(--track); border-radius: 8px; padding: 8px 10px; font-size: calc(13px * var(--scale)); font-family: var(--font); }
        .tsl-ed-actions { display: flex; gap: 8px; margin-top: 16px; }
        .tsl-ed-actions .tsl-btn { flex: 1 1 auto; }
        .tsl-ed-hint { font-size: calc(11px * var(--scale)); color: var(--textmuted); margin-top: 6px; }

        .tsl-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .tsl-btn { flex: 1 1 30%; min-width: 84px; border: none; border-radius: 10px; padding: 10px 8px; font-size: calc(13px * var(--scale)); font-weight: 600; cursor: pointer; background: var(--box); color: var(--text); }
        .tsl-btn.on { color: var(--accent); }
    </style>
</head>

<body>
    <div class="wrap" id="card">
        <div class="tsl-top">
            <div class="tsl-ring">
                <svg viewBox="0 0 96 96">
                    <circle cx="48" cy="48" r="42" fill="none" stroke="var(--track)" stroke-width="9" />
                    <circle id="tsl-arc" cx="48" cy="48" r="42" fill="none" stroke="var(--accent)" stroke-width="9"
                        stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"
                        transform="rotate(-90 48 48)" />
                </svg>
                <div class="pct" id="tsl-soc">–</div>
            </div>
            <div class="tsl-stats">
                <div class="tsl-range" id="tsl-range">–</div>
                <div class="tsl-sub" id="tsl-temps">–</div>
                <div class="tsl-sub" id="tsl-climate">–</div>
            </div>
        </div>

        <div class="tsl-state">
            <span class="tsl-dot"></span>
            <span class="tsl-state-lbl" id="tsl-state">–</span>
            <span class="tsl-pill" id="tsl-geoloc" style="display:none">–</span>
            <span class="tsl-pill" id="tsl-lock" style="margin-left:auto">–</span>
        </div>

        <div class="tsl-boxes">
            <div class="tsl-box"><div class="v" id="tsl-power">–</div><div class="k">Ladeleistung</div></div>
            <div class="tsl-box"><div class="v" id="tsl-amps">–</div><div class="k">Ladestrom Ist/Max</div></div>
            <div class="tsl-box"><div class="v" id="tsl-limit">–</div><div class="k">Ladelimit</div></div>
            <div class="tsl-box"><div class="v" id="tsl-ttf">–</div><div class="k">Zeit bis voll</div></div>
        </div>

        <div class="tsl-loc" id="tsl-loc-wrap" style="display:none">
            <a id="tsl-loc" href="#" target="_blank" rel="noopener">Karte öffnen</a>
        </div>

        <div class="tsl-rules" id="tsl-rules" style="display:none"></div>

        <div class="tsl-rules" id="tsl-geo" style="display:none"></div>

        <div class="tsl-btns" id="tsl-btns"></div>
    </div>

    <div class="tsl-ed" id="tsl-ged">
        <div class="tsl-ed-card">
            <h3 id="ged-title">Standort bearbeiten</h3>

            <label for="ged-name">Name</label>
            <input id="ged-name" type="text" placeholder="z. B. Arbeit">

            <label for="ged-lat">Breitengrad</label>
            <input id="ged-lat" type="text" placeholder="z. B. 48.340874" inputmode="decimal">

            <label for="ged-lon">Längengrad</label>
            <input id="ged-lon" type="text" placeholder="z. B. 8.032679" inputmode="decimal">

            <button class="tsl-btn" id="ged-carpos" style="margin-top:8px">📍 Aktuelle Fahrzeugposition übernehmen</button>
            <div class="tsl-ed-hint" id="ged-hint"></div>

            <label for="ged-radius">Umkreis (m)</label>
            <input id="ged-radius" type="number" min="10" max="5000" step="10" value="100">

            <div class="tsl-ed-actions">
                <button class="tsl-btn" id="ged-cancel">Abbrechen</button>
                <button class="tsl-btn on" id="ged-save">Speichern</button>
            </div>
        </div>
    </div>

    <div class="tsl-ed" id="tsl-ed">
        <div class="tsl-ed-card">
            <h3 id="ed-title">Regel bearbeiten</h3>

            <label for="ed-src">Wenn Datenpunkt</label>
            <select id="ed-src"></select>

            <label for="ed-op">Bedingung</label>
            <select id="ed-op">
                <option value="true">wird EIN (true)</option>
                <option value="false">wird AUS (false)</option>
                <option value="eq">= (gleich)</option>
                <option value="ne">&#8800; (ungleich)</option>
                <option value="gt">&gt; (größer)</option>
                <option value="ge">&#8805; (größer gleich)</option>
                <option value="lt">&lt; (kleiner)</option>
                <option value="le">&#8804; (kleiner gleich)</option>
                <option value="change">ändert sich</option>
                <option value="pass">Durchfahrt (Standort)</option>
            </select>

            <div id="ed-cmp-wrap">
                <label for="ed-cmp">Vergleichswert</label>
                <input id="ed-cmp" type="text" placeholder="z. B. 80 oder Zuhause">
            </div>

            <label for="ed-tfilter">Dann Zielvariable</label>
            <input id="ed-tfilter" type="text" placeholder="Suchen (Name oder Pfad) …" autocomplete="off">
            <select id="ed-target" size="1" style="margin-top:6px"></select>
            <div class="tsl-ed-hint">Angeboten werden schaltbare Variablen (mit Aktion). Andere Ziele lassen sich im Instanzformular wählen.</div>

            <label for="ed-act">Aktion</label>
            <select id="ed-act">
                <option value="on">Einschalten</option>
                <option value="off">Ausschalten</option>
                <option value="toggle">Umschalten</option>
                <option value="value">Wert setzen</option>
            </select>

            <div id="ed-val-wrap">
                <label for="ed-val">Wert</label>
                <select id="ed-val-sel" style="display:none"></select>
                <input id="ed-val" type="text" placeholder="Wert">
            </div>

            <div class="tsl-ed-actions">
                <button class="tsl-btn" id="ed-cancel">Abbrechen</button>
                <button class="tsl-btn on" id="ed-save">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        var RING = 263.9;
        function fmt(v, dec, unit) {
            if (v === null || v === undefined || v === '') return '–';
            var n = Number(v);
            if (isNaN(n)) return String(v);
            return n.toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + (unit || '');
        }

        function handleMessage(payload) {
            var d = (typeof payload === 'string') ? JSON.parse(payload) : payload;
            if (!d) return;

            // Teil-Nachrichten für den Regel-Editor (kein vollständiges Kachel-Update)
            if (d.editor !== undefined) { ED.data = d.editor; edOpenNow(); return; }
            if (d.targetOpts !== undefined) { edApplyTargetOpts(d.targetOpts); return; }

            var root = document.documentElement.style;
            function applyVar(name, val) { if (val) { root.setProperty(name, val); } else { root.removeProperty(name); } }
            root.setProperty('--accent', d.accent || '#2bb3c0');
            applyVar('--bg', d.bg);
            applyVar('--box', d.box);
            applyVar('--text', d.text);
            applyVar('--textmuted', d.textmuted);
            if (d.font) root.setProperty('--font', d.font);
            root.setProperty('--scale', d.scale || 1);

            var geoloc = document.getElementById('tsl-geoloc');
            if (d.location) { geoloc.textContent = '📍 ' + d.location; geoloc.style.display = ''; }
            else { geoloc.style.display = 'none'; }

            var lock = document.getElementById('tsl-lock');
            if (d.locked === null || d.locked === undefined) { lock.textContent = '–'; lock.className = 'tsl-pill'; }
            else { lock.textContent = d.locked ? 'Verriegelt' : 'Entriegelt'; lock.className = 'tsl-pill' + (d.locked ? ' ok' : ''); }

            var soc = (d.soc === null || d.soc === undefined) ? null : Number(d.soc);
            document.getElementById('tsl-soc').textContent = soc === null ? '–' : Math.round(soc) + '%';
            document.getElementById('tsl-arc').setAttribute('stroke-dashoffset',
                soc === null ? RING : (RING * (1 - Math.max(0, Math.min(100, soc)) / 100)));

            document.getElementById('tsl-range').textContent = fmt(d.range, 0, ' km');
            var t = [];
            if (d.insideTemp !== null && d.insideTemp !== undefined) t.push('innen ' + fmt(d.insideTemp, 1, ' °C'));
            if (d.outsideTemp !== null && d.outsideTemp !== undefined) t.push('außen ' + fmt(d.outsideTemp, 1, ' °C'));
            document.getElementById('tsl-temps').textContent = t.length ? t.join(' · ') : '–';
            document.getElementById('tsl-climate').textContent = 'Klima: ' + (d.climate === null || d.climate === undefined ? '–' : (d.climate ? 'ein' : 'aus'));

            document.getElementById('tsl-state').textContent = d.stateLabel || '–';
            document.getElementById('card').classList.toggle('live', d.cls === 'live');

            document.getElementById('tsl-power').textContent = fmt(d.acPower, 2, ' kW');
            document.getElementById('tsl-amps').textContent = fmt(d.ampsActual, 1, '') + ' / ' + fmt(d.ampsMax, 0, ' A');
            document.getElementById('tsl-limit').textContent = fmt(d.chargeLimit, 0, ' %');
            document.getElementById('tsl-ttf').textContent = fmt(d.timeToFull, 1, ' h');

            var lw = document.getElementById('tsl-loc-wrap');
            if (d.lat !== null && d.lat !== undefined && d.lon !== null && d.lon !== undefined) {
                lw.style.display = 'block';
                var a = document.getElementById('tsl-loc');
                a.href = 'https://www.google.com/maps?q=' + d.lat + ',' + d.lon;
                a.textContent = 'Karte: ' + Number(d.lat).toFixed(5) + ', ' + Number(d.lon).toFixed(5);
            } else { lw.style.display = 'none'; }

            var rules = document.getElementById('tsl-rules');
            rules.textContent = '';
            if (Array.isArray(d.rules)) {
                rules.style.display = 'flex';
                var hdrow = document.createElement('div');
                hdrow.className = 'hdrow';
                var hd = document.createElement('div');
                hd.className = 'hd';
                hd.textContent = 'Automationen';
                var add = document.createElement('button');
                add.className = 'tsl-add';
                add.textContent = '+ Neue Regel';
                add.onclick = function () { edOpen(-1, null); };
                hdrow.appendChild(hd);
                hdrow.appendChild(add);
                rules.appendChild(hdrow);
                d.rules.forEach(function (r) {
                    var row = document.createElement('div');
                    row.className = 'tsl-rule' + (r.active ? '' : ' off');
                    var t = document.createElement('span');
                    t.className = 't';
                    t.textContent = r.text;
                    t.title = r.text;
                    var ed = document.createElement('button');
                    ed.className = 'tsl-ico';
                    ed.textContent = '✎';
                    ed.title = 'Regel bearbeiten';
                    ed.onclick = function () { edOpen(r.i, r.rule, r.active); };
                    var del = document.createElement('button');
                    del.className = 'tsl-ico';
                    del.textContent = '\u{1F5D1}';
                    del.title = 'Regel löschen';
                    del.onclick = function () {
                        if (del.dataset.confirm === '1') { requestAction('ruleDelete', r.i); return; }
                        del.dataset.confirm = '1';
                        del.textContent = 'Sicher?';
                        del.className = 'tsl-ico warn';
                        setTimeout(function () { del.dataset.confirm = ''; del.textContent = '\u{1F5D1}'; del.className = 'tsl-ico'; }, 3000);
                    };
                    var sw = document.createElement('button');
                    sw.className = 'tsl-sw' + (r.active ? ' on' : '');
                    sw.setAttribute('aria-label', (r.active ? 'Regel deaktivieren: ' : 'Regel aktivieren: ') + r.text);
                    sw.onclick = function () { requestAction('rule', JSON.stringify({ i: r.i, on: !r.active })); };
                    row.appendChild(t);
                    row.appendChild(ed);
                    row.appendChild(del);
                    row.appendChild(sw);
                    rules.appendChild(row);
                });
            } else {
                rules.style.display = 'none';
            }

            // Standorte (Geofence) – Verwaltung wie bei den Regeln
            LAST_POS = (d.lat !== null && d.lat !== undefined && d.lon !== null && d.lon !== undefined)
                ? { lat: Number(d.lat), lon: Number(d.lon) } : LAST_POS;
            var geo = document.getElementById('tsl-geo');
            geo.textContent = '';
            if (d.geo) {
                geo.style.display = 'flex';
                var ghd = document.createElement('div');
                ghd.className = 'hdrow';
                var gt = document.createElement('div');
                gt.className = 'hd';
                gt.textContent = 'Standorte';
                ghd.appendChild(gt);
                var gr = document.createElement('div');
                gr.style.display = 'flex'; gr.style.gap = '8px'; gr.style.alignItems = 'center';
                if (d.geo.enabled) {
                    var gadd = document.createElement('button');
                    gadd.className = 'tsl-add';
                    gadd.textContent = '+ Neuer Standort';
                    gadd.onclick = function () { gedOpen(-1, null); };
                    gr.appendChild(gadd);
                }
                var gsw = document.createElement('button');
                gsw.className = 'tsl-sw' + (d.geo.enabled ? ' on' : '');
                gsw.title = 'Standort-Erkennung ' + (d.geo.enabled ? 'deaktivieren' : 'aktivieren');
                gsw.onclick = function () { requestAction('geoEnable', !d.geo.enabled); };
                gr.appendChild(gsw);
                ghd.appendChild(gr);
                geo.appendChild(ghd);

                if (d.geo.enabled) {
                    function fenceRow(label, onEdit, onDelete) {
                        var row = document.createElement('div');
                        row.className = 'tsl-rule';
                        var t = document.createElement('span');
                        t.className = 't';
                        t.textContent = label;
                        t.title = label;
                        row.appendChild(t);
                        var ed = document.createElement('button');
                        ed.className = 'tsl-ico';
                        ed.textContent = '✎';
                        ed.title = 'Standort bearbeiten';
                        ed.onclick = onEdit;
                        row.appendChild(ed);
                        if (onDelete) {
                            var del = document.createElement('button');
                            del.className = 'tsl-ico';
                            del.textContent = '\u{1F5D1}';
                            del.title = 'Standort löschen';
                            del.onclick = function () {
                                if (del.dataset.confirm === '1') { onDelete(); return; }
                                del.dataset.confirm = '1';
                                del.textContent = 'Sicher?';
                                del.className = 'tsl-ico warn';
                                setTimeout(function () { del.dataset.confirm = ''; del.textContent = '\u{1F5D1}'; del.className = 'tsl-ico'; }, 3000);
                            };
                            row.appendChild(del);
                        }
                        geo.appendChild(row);
                    }
                    var h = d.geo.home || {};
                    var hl = '🏠 Zuhause · ' + (h.radius || 100) + ' m' + (h.fromSystem ? ' (Systemstandort)' : (h.lat === null || h.lat === undefined ? ' (kein Standort!)' : ''));
                    fenceRow(hl, function () { gedOpen('home', h); }, null);
                    (d.geo.fences || []).forEach(function (f) {
                        fenceRow('📍 ' + f.name + ' · ' + f.radius + ' m' + (f.lat === null || f.lat === undefined ? ' (ungültig!)' : ''),
                            function () { gedOpen(f.i, f); },
                            function () { requestAction('fenceDelete', f.i); });
                    });
                }
            } else {
                geo.style.display = 'none';
            }

            var btns = document.getElementById('tsl-btns');
            btns.textContent = '';
            if (d.controls) {
                function addBtn(label, on, ident, value) {
                    var b = document.createElement('button');
                    b.className = 'tsl-btn' + (on ? ' on' : '');
                    b.textContent = label;
                    b.onclick = function () { requestAction(ident, value); };
                    btns.appendChild(b);
                }
                addBtn(d.locked ? 'Entriegeln' : 'Verriegeln', false, 'lock', !d.locked);
                addBtn(d.climate ? 'Klima aus' : 'Klima ein', !!d.climate, 'climate', !d.climate);
                addBtn(d.charging ? 'Laden stop' : 'Laden start', !!d.charging, 'charge', !d.charging);
            }
        }

        // ------------------------------------------------------------------
        // Standort-Editor
        // ------------------------------------------------------------------
        var LAST_POS = null;            // letzte bekannte Fahrzeugposition
        var GED = { i: -1 };            // 'home' oder Index in GeofenceList

        function gedOpen(i, fence) {
            GED.i = i;
            var isHome = (i === 'home');
            var f = fence || {};
            document.getElementById('ged-title').textContent = isHome ? 'Zuhause bearbeiten' : (i < 0 ? 'Neuer Standort' : 'Standort bearbeiten');
            var name = document.getElementById('ged-name');
            name.value = isHome ? 'Zuhause' : (f.name || '');
            name.disabled = isHome;
            document.getElementById('ged-lat').value = (f.lat === null || f.lat === undefined) ? '' : f.lat;
            document.getElementById('ged-lon').value = (f.lon === null || f.lon === undefined) ? '' : f.lon;
            document.getElementById('ged-radius').value = f.radius || 100;
            document.getElementById('ged-hint').textContent = isHome
                ? 'Leer lassen = Systemstandort aus der Kern-Instanz \'Location\'. Kartenauswahl gibt es im Instanzformular.'
                : 'Koordinaten eintragen oder die Fahrzeugposition übernehmen. Kartenauswahl gibt es im Instanzformular.';
            document.getElementById('ged-carpos').disabled = !LAST_POS;
            document.getElementById('tsl-ged').classList.add('open');
        }

        function gedClose() { document.getElementById('tsl-ged').classList.remove('open'); }

        document.getElementById('ged-carpos').onclick = function () {
            if (!LAST_POS) return;
            document.getElementById('ged-lat').value = LAST_POS.lat.toFixed(6);
            document.getElementById('ged-lon').value = LAST_POS.lon.toFixed(6);
        };
        document.getElementById('ged-cancel').onclick = gedClose;
        document.getElementById('tsl-ged').onclick = function (ev) { if (ev.target === this) gedClose(); };
        document.getElementById('ged-save').onclick = function () {
            var lat = document.getElementById('ged-lat').value.replace(',', '.').trim();
            var lon = document.getElementById('ged-lon').value.replace(',', '.').trim();
            var radius = parseInt(document.getElementById('ged-radius').value || '100', 10);
            if (GED.i === 'home') {
                requestAction('homeSave', JSON.stringify({ lat: lat, lon: lon, radius: radius }));
                gedClose();
                return;
            }
            var name = document.getElementById('ged-name').value.trim();
            if (!name || !lat || !lon) return;
            requestAction('fenceSave', JSON.stringify({ i: GED.i, fence: { name: name, lat: lat, lon: lon, radius: radius } }));
            gedClose();
        };

        // ------------------------------------------------------------------
        // Regel-Editor
        // ------------------------------------------------------------------
        var ED = { data: null, i: -1, rule: null, active: true, pendingOpen: false };
        var NUM_OPS = ['eq', 'ne', 'gt', 'ge', 'lt', 'le'];

        function edOpen(i, rule, active) {
            ED.i = i;
            ED.rule = rule || { Source: '', Op: 'true', Compare: '', Target: 0, Action: 'on', Value: '' };
            ED.active = (active === undefined) ? true : !!active;
            if (ED.data) { edOpenNow(); }
            else { ED.pendingOpen = true; requestAction('ruleEditor', ''); }
        }

        function edOpenNow() {
            if (!ED.data) return;
            if (ED.pendingOpen) ED.pendingOpen = false;
            var src = document.getElementById('ed-src');
            src.textContent = '';
            (ED.data.sources || []).forEach(function (s) {
                var o = document.createElement('option');
                o.value = s.v; o.textContent = s.c;
                src.appendChild(o);
            });
            if (ED.rule.Source) src.value = ED.rule.Source;
            document.getElementById('ed-op').value = ED.rule.Op || 'true';
            document.getElementById('ed-cmp').value = ED.rule.Compare || '';
            document.getElementById('ed-tfilter').value = '';
            edRenderTargets('');
            document.getElementById('ed-act').value = ED.rule.Action || 'on';
            document.getElementById('ed-val').value = ED.rule.Value || '';
            document.getElementById('ed-title').textContent = (ED.i < 0) ? 'Neue Regel' : 'Regel bearbeiten';
            edSync();
            document.getElementById('tsl-ed').classList.add('open');
        }

        function edRenderTargets(filter) {
            var sel = document.getElementById('ed-target');
            sel.textContent = '';
            var f = (filter || '').toLowerCase();
            var count = 0, hasCurrent = false;
            (ED.data.targets || []).forEach(function (t) {
                if (count >= 200) return;
                var label = t.p || t.c;
                if (f && label.toLowerCase().indexOf(f) < 0) return;
                var o = document.createElement('option');
                o.value = t.v; o.textContent = label;
                sel.appendChild(o);
                if (String(t.v) === String(ED.rule.Target)) hasCurrent = true;
                count++;
            });
            // Aktuelles Ziel immer anbieten, auch wenn es nicht in der (gefilterten/gekappten)
            // Liste ist – mit richtigem Namen aus der Gesamtliste, #ID nur als letzter Ausweg
            if (!hasCurrent && ED.rule.Target > 0) {
                var known = (ED.data.targets || []).find(function (t) { return String(t.v) === String(ED.rule.Target); });
                var cur = document.createElement('option');
                cur.value = ED.rule.Target;
                cur.textContent = known ? (known.p || known.c) : ('#' + ED.rule.Target);
                sel.insertBefore(cur, sel.firstChild);
            }
            if (ED.rule.Target > 0) sel.value = String(ED.rule.Target);
        }

        function edSync() {
            var op = document.getElementById('ed-op').value;
            document.getElementById('ed-cmp-wrap').style.display = (NUM_OPS.indexOf(op) >= 0) ? 'block' : 'none';
            var isValue = (document.getElementById('ed-act').value === 'value');
            document.getElementById('ed-val-wrap').style.display = isValue ? 'block' : 'none';
            if (isValue) {
                // Profil-/Presentation-Werte der Zielvariable anfragen (kommen als targetOpts zurück)
                var vid = parseInt(document.getElementById('ed-target').value || '0', 10);
                document.getElementById('ed-val-sel').style.display = 'none';
                document.getElementById('ed-val').style.display = '';
                if (vid > 0) requestAction('targetOpts', vid);
            }
        }

        function edApplyTargetOpts(to) {
            if (!document.getElementById('tsl-ed').classList.contains('open')) return;
            var vid = parseInt(document.getElementById('ed-target').value || '0', 10);
            if (!to || parseInt(to.vid, 10) !== vid) return;
            var sel = document.getElementById('ed-val-sel');
            var inp = document.getElementById('ed-val');
            if (to.options && to.options.length) {
                sel.textContent = '';
                to.options.forEach(function (o) {
                    var e = document.createElement('option');
                    e.value = o.v; e.textContent = o.c + ' (' + o.v + ')';
                    sel.appendChild(e);
                });
                if (inp.value !== '') sel.value = inp.value;
                if (sel.selectedIndex < 0) sel.selectedIndex = 0;
                sel.style.display = '';
                inp.style.display = 'none';
            } else {
                sel.style.display = 'none';
                inp.style.display = '';
            }
        }

        function edClose() { document.getElementById('tsl-ed').classList.remove('open'); }

        document.getElementById('ed-op').onchange = edSync;
        document.getElementById('ed-act').onchange = edSync;
        document.getElementById('ed-target').onchange = edSync;
        document.getElementById('ed-tfilter').oninput = function () { edRenderTargets(this.value); edSync(); };
        document.getElementById('ed-cancel').onclick = edClose;
        document.getElementById('tsl-ed').onclick = function (ev) { if (ev.target === this) edClose(); };
        document.getElementById('ed-save').onclick = function () {
            var valSel = document.getElementById('ed-val-sel');
            var rule = {
                Active: ED.active,
                Source: document.getElementById('ed-src').value,
                Op: document.getElementById('ed-op').value,
                Compare: document.getElementById('ed-cmp').value,
                Target: parseInt(document.getElementById('ed-target').value || '0', 10),
                Action: document.getElementById('ed-act').value,
                Value: (valSel.style.display !== 'none') ? valSel.value : document.getElementById('ed-val').value
            };
            if (!rule.Source || !(rule.Target > 0)) return;
            requestAction('ruleSave', JSON.stringify({ i: ED.i, rule: rule }));
            edClose();
        };
    </script>
</body>

</html>
